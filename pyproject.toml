[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "retico-simplelogger"
dynamic = ["version"]
dependencies = [
    "retico-core>=2.0.0",
    "orjson",
]
requires-python = ">=3.9"
authors = [
    {name = "Porter Rigby"},
]
description = "A simple module for logging incremental units to a JSON file."
readme = "README.md"
license = { file = "LICENSE" }
keywords = [
    "retico",
    "framework",
    "incremental",
    "dialogue",
    "logging",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Repository = "https://github.com/retico-team/retico-simplelogger"

[tool.setuptools_scm]
version_file = "retico_simplelogger/version.py"
